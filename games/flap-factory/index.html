<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flap Factory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap">
<style>
:root{--bg:#0b0a16;--fg:#e9f6ff;--line:#27e3ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a16;--fg:#e9f6ff}}
:root[data-theme="dark"]{--bg:#0b0a16;--fg:#e9f6ff}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"Chakra Petch",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;border-radius:6px;box-shadow:0 0 0 2px #27e3ff55,0 0 40px #8a4dff44}
#bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;display:flex;gap:6px;z-index:5}
#bar button{font:600 13px "Chakra Petch",system-ui,sans-serif;color:var(--fg);background:#0b0a16cc;border:1px solid #27e3ff88;border-radius:6px;padding:6px 10px;cursor:pointer}
#bar button:focus-visible{outline:2px solid #ffb02e;outline-offset:2px}
</style></head><body>
<div id="bar"><button id="bp" type="button">Pause</button><button id="bm" type="button">Sound on</button></div>

// ===== Asset loading (falls back to shapes if an image fails) =====
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),{W,H}=CONFIG;
const IMG={};let pending=Object.keys(SRC).length;
for(const k in SRC){const i=new Image();i.onload=i.onerror=()=>{i.ok=i.naturalWidth>0;if(--pending===0)ready=true};i.src=SRC[k];IMG[k]=i}
let ready=false;

// ===== State =====
let state="ready",paused=false,muted=false,t=0,score=0,best=0,speedMul=1,gap=CONFIG.gap,bgX=0,shake=0,lock=0;
const bird={y:H*.45,vy:0,rot:0,sq:0,mouth:0};
let pipes=[],parts=[];
const stars=Array.from({length:45},()=>({x:Math.random()*W,y:Math.random()*H*.8,r:Math.random()*1.6+.6}));
try{best=+localStorage.getItem("flapFactoryBest")||0}catch(e){}

// ===== Sound (generated tones) =====
let AC;
function tone(f,d,type,v,slide){if(muted)return;try{AC=AC||new AudioContext();const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||"square";o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),n+d);g.gain.setValueAtTime(v||.07,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}

// ===== Input =====
function burst(x,y,n,cols){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*3+1;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:24+Math.random()*12,c:cols[i%cols.length]})}}
function flap(){
  if(paused||!ready)return;
  if(state==="ready"){state="play";score=0;speedMul=1;gap=CONFIG.gap;pipes=[];spawn()}
  if(state==="play"){bird.vy=CONFIG.flap;bird.sq=1;bird.mouth=14;burst(CONFIG.bx-14,bird.y+10,6,["#27e3ff","#ffb02e"]);tone(520,.12,"square",.06,300)}
  else if(state==="over"&&performance.now()>lock){state="ready";bird.y=H*.45;bird.vy=0;bird.rot=0;pipes=[]}
}
addEventListener("pointerdown",e=>{if(e.target.closest("#bar"))return;e.preventDefault();flap()});
addEventListener("keydown",e=>{
  if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();if(!e.repeat)flap()}
  else if(e.code==="KeyP")togglePause();
  else if(e.code==="KeyM")toggleMute();
});
function togglePause(){if(state==="play")paused=!paused;bp.textContent=paused?"Resume":"Pause"}
function toggleMute(){muted=!muted;bm.textContent=muted?"Sound off":"Sound on"}
const bp=document.getElementById("bp"),bm=document.getElementById("bm");
bp.onclick=e=>{e.stopPropagation();togglePause();bp.blur()};
bm.onclick=e=>{e.stopPropagation();toggleMute();bm.blur()};
addEventListener("blur",()=>{if(state==="play"&&!paused)togglePause()});

// ===== Update =====
function spawn(){pipes.push({x:W+10,cy:150+Math.random()*(H-300),gap,done:false})}
function die(){state="over";shake=12;lock=performance.now()+400;burst(CONFIG.bx,bird.y,26,["#ff5a4d","#ffb02e","#27e3ff"]);tone(160,.4,"sawtooth",.1,-100);
  if(score>best){best=score;try{localStorage.setItem("flapFactoryBest",best)}catch(e){}}}
function step(){
  t++;const sp=CONFIG.speed*speedMul;
  bgX+=state==="over"?.3:sp*CONFIG.bgFactor;
  for(const s of stars){s.x-=(state==="over"?.2:sp*.6);if(s.x<0)s.x+=W}
  if(bird.mouth>0)bird.mouth--;bird.sq*=.85;
  if(state==="ready")bird.y=H*.45+Math.sin(t/18)*10;
  if(state==="play"||state==="over"){
    bird.vy=Math.min(bird.vy+CONFIG.gravity,CONFIG.maxFall);bird.y+=bird.vy;
    bird.rot=Math.max(-.5,Math.min(1.2,bird.vy*.07));
  }
  if(state==="play"){
    if(!pipes.length||pipes[pipes.length-1].x<W-CONFIG.spacing)spawn();
    for(const p of pipes){
      p.x-=sp;
      if(!p.done&&p.x+CONFIG.armW<CONFIG.bx){p.done=true;score++;tone(880,.1,"triangle",.08,400);
        if(score%CONFIG.rampEvery===0){speedMul=Math.min(CONFIG.speedCap,speedMul*1.05);gap=Math.max(CONFIG.gapMin,gap-4)}}
      const top=p.cy-p.gap/2,bot=p.cy+p.gap/2,ix=p.x+6,iw=CONFIG.armW-12;
      for(const [ry,rh] of [[0,top],[bot,H-bot]]){
        const nx=Math.max(ix,Math.min(CONFIG.bx,ix+iw)),ny=Math.max(ry,Math.min(bird.y,ry+rh));
        if((CONFIG.bx-nx)**2+(bird.y-ny)**2<CONFIG.hit**2)die();
      }
    }
    pipes=pipes.filter(p=>p.x>-CONFIG.armW-10);
    if(bird.y-CONFIG.hit<0||bird.y+CONFIG.hit>H)die();
  }
  if(state==="over"){bird.y=Math.min(bird.y,H-CONFIG.hit)}
  for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.life--}
  parts=parts.filter(q=>q.life>0);if(shake>0)shake--;
}

// ===== Render =====
function txt(s,x,y,size,col,align){ctx.font="700 "+size+'px "Chakra Petch",system-ui,sans-serif';ctx.textAlign=align||"center";ctx.lineWidth=Math.max(3,size/7);ctx.strokeStyle="#0b0a16";ctx.lineJoin="round";ctx.strokeText(s,x,y);ctx.fillStyle=col||"#e9f6ff";ctx.fillText(s,x,y)}
function drawBg(){
  const b=IMG.bg;if(!b.ok){ctx.fillStyle="#1a1240";ctx.fillRect(0,0,W,H);return}
  const w=b.naturalWidth*H/b.naturalHeight;let x=-(bgX%(2*w)),k=0;
  ctx.imageSmoothingEnabled=true;
  while(x<W){ // alternate mirrored tiles so the loop has no visible seam
    if(k%2){ctx.save();ctx.translate(x+w,0);ctx.scale(-1,1);ctx.drawImage(b,0,0,w,H);ctx.restore()}else ctx.drawImage(b,x,0,w,H);
    x+=w;k++}
  ctx.fillStyle="rgba(8,6,24,.22)";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#e9f6ff";for(const s of stars){ctx.globalAlpha=.5;ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;
}
// Top arm: claw sits at bottom of the image. Extra length stretches the top rows.
function armTop(x,len){
  const a=IMG.at,w=CONFIG.armW;if(len<=0)return;
  if(!a.ok){ctx.fillStyle="#3b5a82";ctx.fillRect(x,0,w,len);return}
  const s=w/a.naturalWidth,ih=a.naturalHeight*s;
  if(len<=ih)ctx.drawImage(a,0,a.naturalHeight-len/s,a.naturalWidth,len/s,x,0,w,len);
  else{ctx.drawImage(a,0,0,a.naturalWidth,30,x,0,w,len-ih+1);ctx.drawImage(a,x,len-ih,w,ih)}
}
// Bottom arm: cap sits at top of the image. Extra length stretches the bottom rows.
function armBot(x,y){
  const a=IMG.ab,w=CONFIG.armW,len=H-y;
  if(!a.ok){ctx.fillStyle="#3b5a82";ctx.fillRect(x,y,w,len);return}
  const s=w/a.naturalWidth,ih=a.naturalHeight*s;
  if(len<=ih)ctx.drawImage(a,0,0,a.naturalWidth,len/s,x,y,w,len);
  else{ctx.drawImage(a,x,y,w,ih);ctx.drawImage(a,0,a.naturalHeight-30,a.naturalWidth,30,x,y+ih-1,w,len-ih+1)}
}
function drawBird(){
  const f=bird.mouth>0?IMG.f1:IMG.f0;
  ctx.save();ctx.translate(CONFIG.bx,bird.y);ctx.rotate(bird.rot);
  ctx.scale(1-bird.sq*.12,1+bird.sq*.18);
  if(f.ok){const h=CONFIG.faceH,w=h*f.naturalWidth/f.naturalHeight;ctx.imageSmoothingEnabled=false;ctx.drawImage(f,-w/2,-h/2,w,h)}
  else{ctx.fillStyle="#c27b4a";ctx.beginPath();ctx.arc(0,0,CONFIG.hit,0,6.28);ctx.fill()}
  ctx.restore();
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*.8,(Math.random()-.5)*shake*.8);
  if(!ready){ctx.fillStyle="#0b0a16";ctx.fillRect(0,0,W,H);txt("Loading…",W/2,H/2,28);ctx.restore();return}
  drawBg();
  for(const p of pipes){armTop(p.x,p.cy-p.gap/2);armBot(p.x,p.cy+p.gap/2)}
  for(const q of parts){ctx.globalAlpha=Math.min(1,q.life/20);ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,4,4)}ctx.globalAlpha=1;
  drawBird();
  if(state==="play")txt(score,W/2,90,64,"#ffb02e");
  if(state==="ready"){
    txt("Flap Factory",W/2,170,50,"#27e3ff");
    txt("Dodge the robot arms",W/2,210,20);
    txt("Tap or press Space to launch",W/2,H-110,22,"#ffb02e");
  }
  if(state==="over"){
    ctx.fillStyle="rgba(8,6,24,.72)";ctx.fillRect(60,200,W-120,250);
    ctx.strokeStyle="#27e3ff";ctx.lineWidth=2;ctx.strokeRect(60,200,W-120,250);
    txt("System failure",W/2,252,34,"#ff5a4d");
    txt("Score "+score,W/2,308,32);
    txt("Best "+best,W/2,350,24,"#ffb02e");
    txt("Tap or press Space to retry",W/2,415,20,"#27e3ff");
  }
  if(paused){ctx.fillStyle="rgba(8,6,24,.6)";ctx.fillRect(0,0,W,H);txt("Paused",W/2,H/2,46);txt("Press P or tap Resume",W/2,H/2+40,18)}
  ctx.restore();
}

// ===== Main loop (fixed 60 Hz timestep) =====
let last=performance.now(),acc=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(100,ts-last);last=ts;
  if(!paused&&ready){acc+=dt;while(acc>=1000/60){step();acc-=1000/60}}
  draw();
}
function resize(){const s=Math.min(document.body.clientWidth/W,document.body.clientHeight/H);cv.style.width=W*s+"px";cv.style.height=H*s+"px"}
addEventListener("resize",resize);resize();requestAnimationFrame(loop);
</script></body></html>
